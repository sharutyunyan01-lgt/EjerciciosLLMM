<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejemplo Formulario</title>
</head>
<body>
    
    <h1 style="text-align: center;">Formularios</h1>
    <table style="border:2px solid black; font-size: 20px;
    margin-left:auto; margin-right: auto;">
    <form action="manejador.html" enctype="multipart/form-data"
    method="post" name="formtipos" id="formulario"></form>    
    <tr>
        <td>
            <p>
                <label for="nombre">Nombre:</label>
                <input type="text" name="nombre" maxlength="20">
            </p>
            <p>
                <label>
                    <input type="radio" name="etapa" id="menos20" value="joven" cheked>Menos 20 años
                </label>
            </p>
             <p>
                <label>
                    <input type="radio" name="etapa" id="21-40" value="adulto">Entre 21 y 40 años
            </p>
            <p>
                <label>
                    <input type="radio" name="etapa" id="41-60" value="maduro">Entre 41 y 60 años
            </p>
            <p>
                <label>
                    <input type="radio" name="etapa" id="61-80" value="anciano" cheked>Entre 61 y 80 años
            </p>
            <p>
                <label>
                    <input type="radio" name="etapa" id="mas80" value="achacoso" >Más de 80 años
            </p>
        </td>
    </tr>
</table>
</body>
</html>
